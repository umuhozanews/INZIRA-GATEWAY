<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090A0D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DataBridge" />
    <link rel="icon" type="image/png" href="/logo-round.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>DataBridge — Kinetic Precision POS</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090A0D;
        font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .preloader-logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 104px;
        height: 104px;
      }
      .preloader-ring {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #FF6B00;
        border-right-color: #FF6B00;
        animation: spinRing 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .preloader-glow {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        background: rgba(255, 107, 0, 0.35);
        filter: blur(18px);
        animation: pulseGlow 2s infinite ease-in-out;
      }
      .preloader-img {
        position: relative;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 2px #FF6B00;
        background: #111318;
      }
      .preloader-title {
        margin-top: 22px;
        font-size: 21px;
        font-weight: 900;
        letter-spacing: -0.03em;
        color: #F3F4F6;
      }
      .preloader-subtitle {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #FF6B00;
      }
      .preloader-bar-bg {
        margin-top: 20px;
        width: 140px;
        height: 4px;
        background: #1A1D24;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .preloader-bar-fill {
        width: 100%;
        height: 100%;
        background: #FF6B00;
        border-radius: 999px;
        animation: shimmerFill 1.4s infinite ease-in-out;
      }
      @keyframes spinRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.8; }
      }
      @keyframes shimmerFill {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) { registration.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) { caches.delete(name); }
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader">
        <div class="preloader-logo-wrap">
          <div class="preloader-glow"></div>
          <div class="preloader-ring"></div>
          <img src="/logo-round.png" alt="Inzira Logo" class="preloader-img" />
        </div>
        <h1 class="preloader-title">INZIRA SYSTEM</h1>
        <p class="preloader-subtitle">DataBridge Kinetic POS</p>
        <div class="preloader-bar-bg">
          <div class="preloader-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
